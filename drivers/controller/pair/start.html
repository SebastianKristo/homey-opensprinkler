<form id="form" class="homey-form">
  <h1 class="homey-title" data-i18n="pair.title"></h1>
  <div class="homey-form-group">
    <label class="homey-form-label" for="host" data-i18n="pair.host"></label>
    <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.50" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="password" data-i18n="pair.password"></label>
    <input class="homey-form-input" id="password" type="password" placeholder="opendoor" />
  </div>
  <button class="homey-button-primary-full" type="submit" data-i18n="pair.connect"></button>
</form>
<script type="text/javascript">
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  Homey.showLoadingOverlay();
  try {
    const device = await Homey.emit('connect', {
      host: document.getElementById('host').value,
      password: document.getElementById('password').value,
    });
    if (device) await Homey.createDevice(device);
    Homey.done();
  } catch (err) {
    Homey.hideLoadingOverlay();
    Homey.alert(err.message || err, 'error');
  }
});
</script>
