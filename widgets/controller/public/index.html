<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --fg: var(--homey-text-color, #F2F4F7);
    --muted: var(--homey-text-color-light, #9AA3AE);
    --surface: var(--homey-color-mono-050, #1F242B);
    --surface-2: var(--homey-color-mono-100, #2A3038);
    --line: var(--homey-line-color, #2E343D);
    --blue: #5AB0FF; --blue-strong: #3B8EEA; --blue-text: #3B9BF0;
    --orange: #FFB466; --orange-text: #D9822B; --green: #4FD18B; --red: #F0605D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: var(--homey-font-family, Inter, system-ui, sans-serif); color: var(--fg); }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .wrap { display: flex; flex-direction: column; gap: 14px; padding: var(--homey-su-1, 4px) 0; }
  .top { display: flex; align-items: center; gap: 12px; }
  .icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--surface); color: var(--muted); }
  .on .icon { background: rgba(90,176,255,.16); color: var(--blue); }
  .grow { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; }
  .title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 4px; background: #6B7480; flex-shrink: 0; }
  .switch { width: 56px; height: 34px; border-radius: 17px; border: 0; padding: 3px; background: #3A4049; display: flex; align-items: center; justify-content: flex-start; transition: background .2s; flex-shrink: 0; }
  .switch span { width: 28px; height: 28px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .switch[aria-pressed="true"] { background: var(--blue-strong); justify-content: flex-end; }
  .banner { border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; background: var(--surface); }
  .banner.delay { background: rgba(255,180,102,.12); border: 1px solid rgba(255,180,102,.28); }
  .banner .bi { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,180,102,.18); color: var(--orange); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .banner .h { font-size: 15px; font-weight: 600; color: var(--orange-text); }
  .banner .s { font-size: 13px; color: var(--muted); }
  .pill { height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 600; border: 0; flex-shrink: 0; }
  .pill.warm { background: rgba(255,180,102,.24); color: var(--orange-text); }
  .pill.ghost { background: transparent; border: 1px solid var(--line); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .tile { background: var(--surface); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0; }
  .label { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .big small { font-size: 16px; font-weight: 600; color: var(--muted); }
  .val { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar div { height: 6px; border-radius: 3px; background: var(--blue); transition: width .3s; }
  .steps { display: flex; gap: 8px; margin-top: 4px; }
  .steps button { flex-grow: 1; height: 44px; border-radius: 12px; border: 0; background: var(--surface-2); font-size: 22px; font-weight: 500; }
  .tile.active { background: rgba(90,176,255,.14); }
  .tile.active .label { color: var(--blue-text); }
  .water { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .water .val { font-size: 20px; }
  .water small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .err { color: var(--red); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script type="text/javascript">
  const ICON = {
    drop: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7c3.4 4 6 7.3 6 10.8a6 6 0 0 1-12 0c0-3.5 2.6-6.8 6-10.8z"/></svg>',
    cloud: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 15H7a4 4 0 1 1 .9-7.9A5.5 5.5 0 0 1 18.5 9 3 3 0 0 1 17.5 15z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg>',
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    rain: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 13H7a4 4 0 1 1 .9-7.9A5.5 5.5 0 0 1 18.5 7 3 3 0 0 1 17.5 13z"/><path d="M8 16l-1 2.5M12 16l-1 2.5M16 16l-1 2.5"/></svg>',
  };
  const NO = {
    connected: 'Tilkoblet', disabled: 'Deaktivert', offline: 'Frakoblet', toggle: 'Slå kontroller av eller på',
    delay_until: 'Regnpause til', left: 'igjen', cancel: 'Avbryt', no_delay: 'Ingen regnpause', pause24: 'Pause 24 t',
    water_level: 'Vannivå', lower: 'Senk vannivå', raise: 'Øk vannivå', rain_sensor: 'Regnsensor', dry: 'Tørr', wet: 'Vått',
    running_now: 'Kjører nå', none: 'Ingen', flow_now: 'Vannflyt nå', consumption: 'Forbruk', h: 't',
  };

  function onHomeyReady(Homey) {
    const settings = Homey.getSettings() || {};
    const ctrlId = settings.controller && settings.controller.id;
    const t = k => { try { const v = Homey.__(`widget.${k}`); if (v && v !== `widget.${k}`) return v; } catch (e) { /* no i18n */ } return NO[k]; };
    const root = document.getElementById('root');
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmt = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
    const num = (v, d) => Number(v).toLocaleString('nb-NO', { minimumFractionDigits: d, maximumFractionDigits: d });
    let state = null; let fetchedAt = 0; let busy = false; let lastHeight = 0; let error = null;

    function render() {
      if (!state && !error) return;
      const s = state || { zones: [], online: false };
      const el = (Date.now() - fetchedAt) / 1000;
      const on = s.online && s.enabled;
      const statusText = !s.online ? t('offline') : s.enabled ? t('connected') : t('disabled');
      const dot = !s.online ? 'var(--red)' : s.enabled ? 'var(--green)' : '#6B7480';
      let html = `<div class="top ${on ? 'on' : ''}">
        <div class="icon">${ICON.drop}</div>
        <div class="grow"><div class="title">${esc(s.name || 'OpenSprinkler')}</div>
          <div class="sub"><span class="dot" style="background:${dot}"></span><span>${statusText}${s.host ? ` · ${esc(s.host)}` : ''}</span></div></div>
        <button class="switch" data-a="enable" aria-label="${t('toggle')}" aria-pressed="${!!s.enabled}" ${s.online ? '' : 'disabled'}><span></span></button>
      </div>`;

      if (error && !state) { root.innerHTML = `${html}<div class="err">${esc(error)}</div>`; return fit(); }

      if (s.rainDelay) {
        const left = Math.max(0, (s.rainDelayEnd - s.now) - el);
        const until = s.rainDelayEnd ? new Date(s.rainDelayEnd * 1000).toISOString().slice(11, 16) : '';
        html += `<div class="banner delay"><div class="bi">${ICON.cloud}</div>
          <div class="grow"><div class="h">${t('delay_until')} ${until}</div>
          <div class="s">${Math.floor(left / 3600)} ${t('h')} ${Math.floor((left % 3600) / 60)} min ${t('left')}</div></div>
          <button class="pill warm" data-a="rainDelay" data-v="0">${t('cancel')}</button></div>`;
      } else {
        html += `<div class="banner"><div class="grow s" style="font-size:14px;color:var(--muted)">${t('no_delay')}</div>
          <button class="pill ghost" data-a="rainDelay" data-v="24">${t('pause24')}</button></div>`;
      }

      const running = s.zones.filter(z => z.running && !z.isMaster);
      const r0 = running[0];
      const runText = r0 ? `${esc(r0.id)} · ${fmt(r0.remaining - el)}${running.length > 1 ? ` +${running.length - 1}` : ''}` : t('none');
      const wl = s.waterLevel || 0;
      html += `<div class="grid">
        <div class="tile"><div class="label">${t('water_level')}</div>
          <div class="big">${wl}<small>%</small></div>
          <div class="bar"><div style="width:${Math.min(100, wl / 2)}%"></div></div>
          <div class="steps"><button data-a="waterLevel" data-v="${Math.max(0, wl - 10)}" aria-label="${t('lower')}">−</button>
          <button data-a="waterLevel" data-v="${Math.min(250, wl + 10)}" aria-label="${t('raise')}">+</button></div></div>
        <div class="col">
          <div class="tile"><div class="label">${t('rain_sensor')}</div><div class="val">${s.sensor1 ? ICON.rain : ICON.sun}<span>${s.sensor1 ? t('wet') : t('dry')}</span></div></div>
          <div class="tile ${r0 ? 'active' : ''}"><div class="label">${t('running_now')}</div><div class="val">${runText}</div></div>
        </div></div>`;

      if (s.water) {
        html += `<div class="tile ${s.water.flow > 0 ? 'active' : ''}"><div class="water">
          <div><div class="label">${t('flow_now')}</div><div class="val">${num(s.water.flow, 1)} <small>L/min</small></div></div>
          <div><div class="label">${t('consumption')}</div><div class="val">${s.water.total >= 1000 ? `${num(s.water.total / 1000, 2)} <small>m³</small>` : `${num(s.water.total, 0)} <small>L</small>`}</div></div>
        </div></div>`;
      }

      root.innerHTML = html;
      if (!s.online) root.querySelectorAll('[data-a]').forEach(b => { b.disabled = true; });
      fit();
    }

    function fit() {
      const h = document.body.scrollHeight;
      if (h !== lastHeight) { lastHeight = h; try { Homey.setHeight(h); } catch (e) { /* older Homey */ } }
    }

    root.addEventListener('click', async e => {
      const b = e.target.closest('[data-a]');
      if (!b || busy || b.disabled) return;
      const action = b.dataset.a;
      const value = action === 'enable' ? !state.enabled : Number(b.dataset.v);
      busy = true;
      try { Homey.hapticFeedback(); } catch (err) { /* ignore */ }
      try { setState(await Homey.api('POST', '/command', { controller: ctrlId, action, value })); } catch (err) { error = err.message || String(err); render(); }
      busy = false;
    });

    function setState(s) { state = s; error = null; fetchedAt = Date.now(); render(); }
    async function poll() {
      try { setState(await Homey.api('GET', `/status?controller=${encodeURIComponent(ctrlId || '')}`)); } catch (err) {
        error = err.message || String(err); if (state) state.online = false; render();
      }
    }
    poll().then(() => Homey.ready({ height: document.body.scrollHeight }));
    setInterval(poll, 5000);
    setInterval(() => { if (state && (state.rainDelay || state.zones.some(z => z.running))) render(); }, 1000);
  }
  </script>
</body>
</html>
