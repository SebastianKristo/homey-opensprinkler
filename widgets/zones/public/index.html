<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --fg: var(--homey-text-color, #F2F4F7);
    --muted: var(--homey-text-color-light, #9AA3AE);
    --surface: var(--homey-color-mono-050, #1F242B);
    --surface-2: var(--homey-color-mono-100, #2E3540);
    --sunken: var(--homey-color-mono-025, #0F1215);
    --blue: #5AB0FF; --blue-text: #3B9BF0; --orange: #FFB466; --orange-text: #D9822B; --red: #F0605D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--homey-font-family, Inter, system-ui, sans-serif); color: var(--fg); }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .wrap { display: flex; flex-direction: column; gap: 14px; padding: var(--homey-su-1, 4px) 0; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: var(--muted); }
  .badge { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255,180,102,.16); color: var(--orange-text); font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--sunken); border-radius: 14px; }
  .seg button { height: 36px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .zone { background: var(--surface); border: 1px solid transparent; border-radius: 18px; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .zone.running { background: rgba(90,176,255,.14); border-color: rgba(90,176,255,.35); }
  .row { display: flex; align-items: center; gap: 12px; }
  .zi { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .zi.drip { background: rgba(127,209,174,.16); color: #3FAF7F; }
  .zi.spray { background: rgba(143,180,230,.18); color: #5C8FD6; }
  .running .zi { background: rgba(90,176,255,.2); color: var(--blue-text); }
  .info { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name b { font-weight: 600; color: var(--muted); margin-right: 6px; }
  .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .running .meta { color: var(--blue-text); }
  .go { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .running .go { background: var(--blue); color: #0B0D10; }
  .prog { display: flex; align-items: center; gap: 10px; }
  .bar { flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(90,176,255,.22); overflow: hidden; }
  .bar div { height: 6px; border-radius: 3px; background: var(--blue); transition: width 1s linear; }
  .used { font-size: 12px; font-weight: 600; color: var(--blue-text); white-space: nowrap; }
  .note, .err { font-size: 13px; color: var(--muted); text-align: center; }
  .err { color: var(--red); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div><div class="title" id="title"></div><div class="sub" id="sub"></div></div>
      <div class="badge" id="badge" hidden><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span id="badgeText"></span></div>
    </div>
    <div class="seg" id="seg" role="group"></div>
    <div class="list" id="list"></div>
  </div>
  <script type="text/javascript">
  const ICON = {
    drip: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M8 6v3M16 6v3"/><path d="M8 13c1 1.3 1.6 2.3 1.6 3.1a1.6 1.6 0 0 1-3.2 0c0-.8.6-1.8 1.6-3.1zM16 13c1 1.3 1.6 2.3 1.6 3.1a1.6 1.6 0 0 1-3.2 0c0-.8.6-1.8 1.6-3.1z"/></svg>',
    spray: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-7"/><path d="M9 21h6"/><path d="M12 11V9"/><path d="M7.5 9.5L5 7M16.5 9.5L19 7M12 7V3M5 12H2M22 12h-3"/></svg>',
    play: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.9l11.3-7.2a1 1 0 0 0 0-1.8L8.5 3.9A1 1 0 0 0 7 4.8z"/></svg>',
    stop: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>',
  };
  const NO = {
    zones: 'Soner', zones_n: 'soner', none_active: 'ingen aktive', active: 'aktiv', water_level: 'vannivå', rain_delay: 'Regnpause',
    run_time: 'Kjøretid for manuell start', drip: 'Drypp', spray: 'Spreder', valve: 'Ventil', watering: 'Vanner', left: 'igjen',
    waiting: 'Venter', manual: 'Manuell', run_once: 'Kjør én gang', disabled: 'Deaktivert', last: 'sist', start: 'Start', stop: 'Stopp', in: 'i', controller_off: 'Kontrolleren er av', offline: 'Frakoblet',
  };

  const EN = {
    manual: 'Manual', run_once: 'Run-once', zones: 'Zones', zones_n: 'zones', none_active: 'none active', active: 'active', water_level: 'water level', rain_delay: 'Rain delay', run_time: 'Run time for manual start', drip: 'Drip', spray: 'Sprinkler', valve: 'Valve', watering: 'Watering', left: 'left', waiting: 'Waiting', disabled: 'Disabled', last: 'last', start: 'Start', stop: 'Stop', in: 'for', controller_off: 'The controller is off', offline: 'Offline',
  };
  const FALLBACK = /^(nb|nn|no)/i.test(navigator.language || '') ? NO : EN;

  function onHomeyReady(Homey) {
    const settings = Homey.getSettings() || {};
    const ctrlId = settings.controller && settings.controller.id;
    const t = k => { try { const v = Homey.__(`widget.${k}`); if (v && v !== `widget.${k}`) return v; } catch (e) { /* no i18n */ } return FALLBACK[k]; };
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmt = sec => { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
    const num = (v, d) => Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
    const progName = p => (p === 'Manual' ? t('manual') : p === 'Run-once' ? t('run_once') : p);
    const litres = l => (l >= 1000 ? `${num(l / 1000, 2)} m³` : `${num(l, 0)} L`);

    // Selected run time, remembered per widget instance.
    const storeKey = (() => { try { return `os-minutes-${Homey.getWidgetInstanceId()}`; } catch (e) { return 'os-minutes'; } })();
    let minutes = Number(settings.defaultMinutes) || 10;
    try { const v = Number(localStorage.getItem(storeKey)); if ([5, 10, 15, 30].includes(v)) minutes = v; } catch (e) { /* storage blocked */ }

    let state = null; let fetchedAt = 0; let busy = false; let error = null; let lastHeight = 0;

    function renderSeg() {
      $('seg').setAttribute('aria-label', t('run_time'));
      $('seg').innerHTML = [5, 10, 15, 30].map(m => `<button data-min="${m}" aria-pressed="${m === minutes}">${m} min</button>`).join('');
    }

    function render() {
      $('title').textContent = t('zones');
      if (!state) { $('list').innerHTML = error ? `<div class="err">${esc(error)}</div>` : ''; return fit(); }
      const s = state;
      const el = (Date.now() - fetchedAt) / 1000;
      const zones = s.zones.filter(z => !z.isMaster && (settings.show_disabled || !z.disabled));
      const running = zones.filter(z => z.running);
      $('sub').textContent = !s.online ? t('offline')
        : running.length ? `${running.length} ${t('active')} · ${s.waterLevel} % ${t('water_level')}`
          : `${zones.length} ${t('zones_n')} · ${t('none_active')}`;
      $('badge').hidden = !s.rainDelay;
      $('badgeText').textContent = t('rain_delay');
      const locked = !s.online || !s.enabled;

      let html = zones.map(z => {
        const typeLabel = t(z.type);
        const w = z.water;
        let meta;
        if (z.running) {
          meta = `${t('watering')} · ${fmt(z.remaining - el)} ${t('left')}`;
        } else if (z.waiting) {
          meta = `${t('waiting')}${z.program ? ` · ${esc(progName(z.program))}` : ''}`;
        } else if (z.disabled) {
          meta = t('disabled');
        } else {
          meta = `${typeLabel}${z.valve ? ` · ${t('valve')} ${esc(z.valve)}` : ''}`;
          if (w && w.lastRun) meta += ` · ${litres(w.lastRun)} ${t('last')}`;
        }
        const on = z.running || z.waiting;
        const total = z.total || z.remaining || 1;
        const pct = z.running ? Math.min(100, Math.max(0, ((total - (z.remaining - el)) / total) * 100)) : 0;
        const label = on ? `${t('stop')} ${z.id}` : `${t('start')} ${z.id} ${t('in')} ${minutes} min`;
        return `<div class="zone ${z.running ? 'running' : ''}">
          <div class="row">
            <div class="zi ${z.type}">${ICON[z.type] || ICON.drip}</div>
            <div class="info"><div class="name"><b>${esc(z.id)}</b>${esc(z.label)}</div><div class="meta">${meta}</div></div>
            <button class="go" data-sid="${z.sid}" data-on="${on ? 1 : 0}" aria-label="${esc(label)}" ${locked || z.disabled ? 'disabled' : ''}>${on ? ICON.stop : ICON.play}</button>
          </div>
          ${z.running ? `<div class="prog"><div class="bar"><div style="width:${pct}%"></div></div>${w ? `<span class="used">${num(w.flow, 1)} L/min · ${litres(w.lastRun)}</span>` : ''}</div>` : ''}
        </div>`;
      }).join('');
      if (s.online && !s.enabled) html += `<div class="note">${t('controller_off')}</div>`;
      if (error) html += `<div class="err">${esc(error)}</div>`;
      $('list').innerHTML = html;
      fit();
    }

    function fit() {
      const h = document.body.scrollHeight;
      if (h !== lastHeight) { lastHeight = h; try { Homey.setHeight(h); } catch (e) { /* older Homey */ } }
    }

    function setState(s) { state = s; error = null; fetchedAt = Date.now(); render(); }

    $('seg').addEventListener('click', e => {
      const b = e.target.closest('[data-min]');
      if (!b) return;
      minutes = Number(b.dataset.min);
      try { localStorage.setItem(storeKey, String(minutes)); } catch (err) { /* storage blocked */ }
      renderSeg(); render();
    });

    $('list').addEventListener('click', async e => {
      const b = e.target.closest('[data-sid]');
      if (!b || busy || b.disabled) return;
      busy = true;
      try { Homey.hapticFeedback(); } catch (err) { /* ignore */ }
      const sid = Number(b.dataset.sid);
      try {
        setState(b.dataset.on === '1'
          ? await Homey.api('POST', '/stop', { controller: ctrlId, sid })
          : await Homey.api('POST', '/run', { controller: ctrlId, sid, minutes }));
      } catch (err) { error = err.message || String(err); render(); }
      busy = false;
    });

    async function poll() {
      try { setState(await Homey.api('GET', `/status?controller=${encodeURIComponent(ctrlId || '')}`)); } catch (err) {
        error = err.message || String(err); if (state) state.online = false; render();
      }
    }

    renderSeg();
    poll().then(() => Homey.ready({ height: document.body.scrollHeight }));
    setInterval(poll, 5000);
    // Local countdown between polls; only re-render while something is running.
    setInterval(() => { if (state && state.zones.some(z => z.running)) render(); }, 1000);
  }
  </script>
</body>
</html>
